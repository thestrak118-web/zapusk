/* ============================================================
   Umumiy asos — Figma 390px kanvasi 1:1 ko'chiriladi.
   Har bir element Figma koordinatasida (position:absolute),
   sahifani esa viewport meta (width=390) telefon ekraniga
   proporsional kattalashtiradi.
   Manba: Figma "Untitled" / Page 1.
   ============================================================ */

:root{
  /* Figma'dagi HelveticaNeue va Gilroy litsenziyali — ular faqat
     CTA yozuvida ishlatilgan va SVG kontur bo'lib eksport qilingan
     (assets/txt/*.svg). Qolgan shriftlar Google Fonts'da bepul. */
  --font:      "Mulish", -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-head: "Antonio", "Bebas Neue", "Arial Narrow", Arial, sans-serif;
  --font-ui:   "Poppins", -apple-system, Helvetica, Arial, sans-serif;
  --font-cond: "Bebas Neue", "Arial Narrow", Arial, sans-serif;
}

*,*::before,*::after{ box-sizing:border-box; }

html{ -webkit-text-size-adjust:100%; }

body{
  margin:0;
  overflow-x:hidden;
  font-family:var(--font);
  font-size:16px;
  line-height:1.3;
  -webkit-font-smoothing:antialiased;
  text-rendering:geometricPrecision;
}

img{ display:block; max-width:none; }
a{ color:inherit; text-decoration:none; }
button{ font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
p,h1,h2,h3,ul,li{ margin:0; padding:0; }
li{ list-style:none; }

/* Figma freymi: qat'iy 390px */
.page{
  position:relative;
  width:390px;
  margin-inline:auto;
  overflow:hidden;
}

/* Har bir blok Figma koordinatasida */
.n{ position:absolute; }

.btn{ display:block; user-select:none; transition:transform .12s cubic-bezier(.22,.61,.36,1); }
.btn:active{ transform:translateY(2px); }

@media (prefers-reduced-motion:reduce){
  *{ transition-duration:.001ms !important; }
}

/* Figma freymidan avtomatik yig'ilgan — tools/svg2site.py.
   Qo'lda tahrirlamang: SVG qayta eksport qilinsa, qaytadan yaratiladi. */
body{ background:#000000; }

/* Figma freymi: qat'iy 390.0px kanvas, har bir qatlam absolyut koordinatada.
   .im — rasm to'ldirgan shakl, .v — vektor+matn qatlami (z-tartib DOM bo'yicha) */
.page{ position:relative; width:390.0px; height:1781.0px; margin-inline:auto; overflow:hidden; }

/* Kanvas qat'iy 390.0px. Telefonda <meta viewport width=390.0> uni ekran
   kengligiga moslab kattalashtiradi — u yerda hech narsa qilish shart emas.
   Desktop brauzer esa bu meta'ni e'tiborsiz qoldiradi va sahifa keng
   ekranning o'rtasida tor ustun bo'lib qoladi. Shuning uchun faqat keng
   ekranlarda o'lchamini oshiramiz (zoom layoutga ta'sir qiladi, ya'ni
   balandlik ham o'zi to'g'rilanadi). */
@media (min-width:480px){ .page{ zoom:1.15; } }
@media (min-width:640px){ .page{ zoom:1.3;  } }
@media (min-width:900px){ .page{ zoom:1.45; } }
/* 390.0px dan tor desktop oynasida kesilib qolmasin */
@media (max-width:389px){ .page{ zoom:.92; } }
.im{ position:absolute; display:block; max-width:none; }
.v{ position:absolute; left:0; top:0; pointer-events:none; }
