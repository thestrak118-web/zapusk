<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Variantlarni solishtirish</title>
<meta name="robots" content="noindex">
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef1f6;color:#17243c;font:16px/1.5 system-ui,Arial,sans-serif}
header{max-width:1250px;margin:40px auto 20px;padding:0 20px}
h1{font-size:30px;margin:0 0 4px}
header p{margin:0;color:#526176}
main{max-width:1250px;margin:auto;padding:0 20px 48px;display:grid;
     grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
a.top{display:flex;justify-content:space-between;text-decoration:none;background:#fff;
      color:#1649be;border-radius:16px 16px 0 0;padding:16px 20px;font-weight:700}
iframe{display:block;border:0;width:100%;height:760px;background:#fff;
       border-radius:0 0 16px 16px;box-shadow:0 10px 24px rgba(19,39,73,.05)}
@media(max-width:850px){main{grid-template-columns:1fr;max-width:430px}header{text-align:center}}
</style>
</head>
<body>
<header>
  <h1>Logistika — bepul vebinar</h1>
  <p>19-sentyabr · 20:00 · uchta variant. Saytning o‘zi — <a href="./">asosiy sahifa</a> (variant A).</p>
</header>
<main>
  <section><a class="top" href="./a/">Variant A — ko‘k <span>Ochish ↗</span></a>
    <iframe src="./a/" title="Variant A" loading="lazy"></iframe></section>
  <section><a class="top" href="./b/">Variant B — qora <span>Ochish ↗</span></a>
    <iframe src="./b/" title="Variant B" loading="lazy"></iframe></section>
  <section><a class="top" href="./c/">Variant C — qizil <span>Ochish ↗</span></a>
    <iframe src="./c/" title="Variant C" loading="lazy"></iframe></section>
</main>
</body>
</html>
