<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zapusk — 3 ta variant</title>
<style>
  body{margin:0;background:#111;color:#eee;font:14px/1.5 Inter,system-ui,sans-serif}
  header{padding:22px 24px 6px}
  h1{margin:0;font-size:18px;font-weight:600}
  p{margin:6px 0 0;color:#8b8b8b}
  .grid{display:flex;gap:24px;padding:20px 24px 40px;overflow-x:auto}
  figure{margin:0;flex:0 0 auto}
  figcaption{padding:0 0 8px;color:#9a9a9a;display:flex;gap:10px;align-items:baseline}
  figcaption a{color:#5b8cff;text-decoration:none}
  iframe{width:390px;height:820px;border:0;border-radius:14px;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.5)}
</style>
</head>
<body>
<header>
  <h1>Zapusk — 3 ta landing varianti</h1>
  <p>Figma "Untitled" / Page 2 → Site 1, Site 2, Site 3. Har biri alohida papka: <code>example/a</code>, <code>example/b</code>, <code>example/c</code>.</p>
</header>
<div class="grid">
  <figure>
    <figcaption><b>a</b> — oq / ko'k <a href="example/a/" target="_blank">ochish ↗</a></figcaption>
    <iframe src="example/a/" title="Site 1" loading="lazy"></iframe>
  </figure>
  <figure>
    <figcaption><b>b</b> — qora / oltin <a href="example/b/" target="_blank">ochish ↗</a></figcaption>
    <iframe src="example/b/" title="Site 2" loading="lazy"></iframe>
  </figure>
  <figure>
    <figcaption><b>c</b> — oq / to'q sariq <a href="example/c/" target="_blank">ochish ↗</a></figcaption>
    <iframe src="example/c/" title="Site 3" loading="lazy"></iframe>
  </figure>
</div>
</body>
</html>
