<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, viewport-fit=cover">
<title>AI sizning ishingizni olmaydi — AI'ni biladigan xodim oladi</title>

<meta name="theme-color" content="#FF5722">
<meta property="og:title" content="AI sizning ishingizni olmaydi — AI'ni biladigan xodim oladi">
<meta property="og:description" content="18–19-sentabr, 20:00 — bepul onlayn dars.">
<meta property="og:image" content="assets/s3-hero.webp">
<meta property="og:type" content="website">
<link rel="icon" href="assets/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/site.css">
</head>
<body data-variant="3">

<main class="page">

  <div class="n fade"></div>
  <img class="n orbit"  src="assets/s3-orbit.webp" alt="" loading="eager">
  <span class="n dot dot-1"></span>
  <span class="n dot dot-2"></span>
  <span class="n dot dot-3"></span>
  <span class="n dot dot-4"></span>
  <div class="n pill"></div>
  <img class="n person" src="assets/s3-hero.webp" alt="Vebinar spikeri" loading="eager">

  <div class="n chip chip-l"></div>
  <img class="n cal-ico"   src="assets/s3-cal.svg" alt="" width="15" height="15">
  <img class="n date-txt"  src="assets/txt/date.svg" alt="18-19-sentabr" width="78" height="13">
  <img class="n logo"      src="assets/logo.webp" alt="uStudy" width="68" height="68">
  <div class="n chip chip-r"></div>
  <img class="n clock-ico" src="assets/s3-clock.svg" alt="" width="17" height="16">
  <img class="n time-txt"  src="assets/txt/time.svg" alt="Soat 20:00" width="58" height="13">

  <h1><img class="n h1" src="assets/txt/h1.svg" alt="AI sizning ishingizni olmaydi — AI'ni biladigan xodim oladi" width="349" height="68"></h1>

<a class="n form" href="#" data-cta="pill" aria-label="Bepul qatnashish">
    <span class="form__plus">+</span>
    <span class="form__send">
      <svg width="10" height="11" viewBox="0 0 10 11" fill="none" aria-hidden="true">
        <path d="M5 10.5V1M5 1L1 5M5 1l4 4" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
  </a>

  <a class="n btn cta cta-1" href="#" data-cta="hero">
    <img class="lbl" src="assets/txt/cta1.svg" alt="Bepul qatnashish" width="180" height="24">
    <span class="disc"></span>
    <img class="arw" src="assets/s3-btn-arrow.svg" alt="" width="11" height="12">
  </a>

  <div class="n timer" data-timer="ms">01:59</div>

  <h2><img class="n h2" src="assets/txt/h2.svg" alt="Bepul darsda o'rganasiz" width="310" height="28"></h2>

  <div class="n card card-1"></div>
  <img class="n card-img card-img-1" src="assets/s3-card1.webp" alt="" loading="lazy">
  <span class="n check check-1"></span>
  <img class="n tick tick-1" src="assets/s3-check.svg" alt="" width="12" height="9">
  <img class="n ct-1" src="assets/txt/t1.svg" alt="AI'ga to'g'ri so'rov (prompt) berish formulasini o'rganasiz — yillab dasturlash o'rganmasdan sayt va Telegram bot yasang" width="271" height="50" loading="lazy">

  <div class="n card card-2"></div>
  <img class="n card-img card-img-2" src="assets/s3-card2.webp" alt="" loading="lazy">
  <span class="n check check-2"></span>
  <img class="n tick tick-2" src="assets/s3-check.svg" alt="" width="12" height="9">
  <img class="n ct-2" src="assets/txt/t2.svg" alt="AI orqali reklama videolari, rasm va dizayn postlar yasashni ko'rasiz — bunday videolar uchun bozorda 20–50$ to'lanmoqda" width="280" height="49" loading="lazy">

  <div class="n card card-3"></div>
  <img class="n card-img card-img-3" src="assets/s3-card3.webp" alt="" loading="lazy">
  <span class="n check check-3"></span>
  <img class="n tick tick-3" src="assets/s3-check.svg" alt="" width="12" height="9">
  <img class="n ct-3" src="assets/txt/t3.svg" alt="Bir kishiga SMM, videograf va storismaker uchun alohida pul to'lash o'rniga, bu ishlarni AI'ga qildirish tizimini olasiz" width="279" height="49" loading="lazy">

  <div class="n card card-4"></div>
  <img class="n card-img card-img-4" src="assets/s3-card4.webp" alt="" loading="lazy">
  <span class="n check check-4"></span>
  <img class="n tick tick-4" src="assets/s3-check.svg" alt="" width="12" height="9">
  <img class="n ct-4" src="assets/txt/t4.svg" alt="Hisobot, prezentatsiya va hujjatlaringizni AI bilan daqiqalarda tayyorlashni o'rganasiz soatlab ketadigan ish bir necha daqiqada" width="272" height="49" loading="lazy">

  <div class="n card card-5"></div>
  <img class="n card-img card-img-5" src="assets/s3-card5.webp" alt="" loading="lazy">
  <span class="n check check-5"></span>
  <img class="n tick tick-5" src="assets/s3-check.svg" alt="" width="12" height="9">
  <img class="n ct-5" src="assets/txt/t5.svg" alt="AI'ni o'rganib qo'shimcha oyiga 500–1000$ daromadga chiqish va birinchi mijozni topish qadamlarini bilib olasiz" width="273" height="51" loading="lazy">

  <a class="n btn cta cta-2" href="#" data-cta="footer">
    <img class="lbl" src="assets/txt/cta2.svg" alt="Bepul qatnashish" width="180" height="24">
    <span class="disc"></span>
    <img class="arw" src="assets/s3-btn-arrow.svg" alt="" width="11" height="12">
  </a>

</main>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
