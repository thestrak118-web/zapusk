<!doctype html><meta charset="utf-8"><title>Figma verify</title>
<!-- Raqamli tekshiruv: sahifadagi har bir [data-fig] elementni Figma
     absoluteBoundingBox / absoluteRenderBounds bilan solishtiradi.
     ?v=d|e|f  — variant                                            -->
<style>html,body{margin:0;background:#111;color:#ddd;font:12px monospace}iframe{width:390px;height:2000px;border:0}</style>
<iframe id="f"></iframe><pre id="out">…</pre>
<script>
const p=new URLSearchParams(location.search), v=p.get('v')||'d';
const H={d:1358,e:1764,f:1880};
f.style.height=H[v]+'px';
f.src='../example/'+v+'/index.html';
(async()=>{
  const fig=await (await fetch('figma-p1.json')).json();
  await new Promise(r=>f.addEventListener('load',r,{once:true}));
  const doc=f.contentDocument, win=f.contentWindow;
  await doc.fonts.ready; await new Promise(r=>setTimeout(r,900)); await doc.fonts.ready;
  const page=doc.querySelector('.page').getBoundingClientRect();
  const rows=[];
  doc.querySelectorAll('[data-fig]').forEach(el=>{
    const id=el.dataset.fig, F=fig[id.replace(/f$/,'')];
    const r=el.getBoundingClientRect();
    const row={id,cls:el.className,box:[r.left-page.left,r.top-page.top,r.width,r.height].map(x=>+x.toFixed(2))};
    const cs=win.getComputedStyle(el);
    if(el.children.length===0 && el.textContent.trim() || el.tagName==='P'||el.tagName==='H1'||el.tagName==='H2'||el.tagName==='SPAN'){
      const rg=doc.createRange(); rg.selectNodeContents(el);
      const rects=[...rg.getClientRects()].filter(x=>x.width>0.4&&x.height>0.4);
      const lines={};
      rects.forEach(x=>{const k=x.top.toFixed(1); lines[k]=(lines[k]||0)+x.width;});
      const keys=Object.keys(lines).sort((a,b)=>a-b);
      row.lines=keys.length;
      row.maxw=+Math.max(...keys.map(k=>lines[k])).toFixed(2);
      row.font=cs.fontFamily.split(',')[0].replace(/"/g,'')+' '+cs.fontWeight+' '+cs.fontSize+'/'+cs.lineHeight+' ls'+cs.letterSpacing;
      const ink=rects.reduce((a,x)=>({t:Math.min(a.t,x.top),b:Math.max(a.b,x.bottom)}),{t:1e9,b:-1e9});
      row.linebox=[+(ink.t-page.top).toFixed(2),+(ink.b-page.top).toFixed(2)];
    }
    rows.push(row);
  });
  out.textContent='REPORT'+JSON.stringify(rows)+'ENDREPORT';
})();
</script>
