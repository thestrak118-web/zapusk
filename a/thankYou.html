<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Logistika vebinari — oxirgi qadam</title>
  <link rel="preload" href="./fonts/thanks-bebas.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./fonts/thanks-montserrat.woff2" as="font" type="font/woff2" crossorigin>
  <style>@font-face{font-family:"Bebas Neue";src:url("./fonts/thanks-bebas.woff2") format("woff2");font-weight:400;font-display:swap}@font-face{font-family:Montserrat;src:url("./fonts/thanks-montserrat.woff2") format("woff2");font-weight:500 700;font-display:swap}*{margin:0;padding:0;box-sizing:border-box}body{background:#ebe8e3;color:#000}.header{min-height:100vh;padding-top:180px}.header-container{margin:auto;max-width:671px;width:100%;display:flex;padding:0 20px}.hero-left,.hero-content{width:100%;display:flex;flex-direction:column;align-items:center}.hero-title{font-family:"Bebas Neue",sans-serif;font-weight:700;font-size:96px;line-height:1;text-align:center;margin-bottom:25px;text-transform:uppercase;max-width:622px}.hero-text{font-family:Montserrat,sans-serif;font-weight:500;font-size:clamp(17px,5vw,29px);line-height:1.5;margin-bottom:58px;max-width:522px}.hero-text span{color:red}.hero-btn-box{max-width:585px;width:100%}.hero-img{display:block;margin:0 auto 46px;width:16px;height:119px}.hero-btn{display:flex;align-items:center;justify-content:center;font-family:"Bebas Neue",sans-serif;font-weight:700;font-size:64px;line-height:1;text-align:center;padding:39px 0 38px;background:#039be5;box-shadow:0 5px #006393;color:#fff;border-radius:30px;width:100%;border:0;text-transform:uppercase;margin-bottom:42px;text-decoration:none;max-height:142px}.submission-feedback{font-family:Montserrat,sans-serif;font-size:15px;font-weight:500;line-height:1.5;text-align:center}[hidden]{display:none!important}@media(max-width:500px){.header{padding-top:30%}.header-container{text-align:center;padding:0 10px}.hero-left,.hero-content{display:block}.hero-title{font-size:40px;margin-bottom:5px}.hero-img{margin-bottom:24px;height:69px;width:auto}.hero-btn{font-size:32px;padding:23px 0 20px;max-width:345px;margin:0 auto 25px}.submission-feedback{font-size:13px;max-width:345px;margin:auto}}</style>
  <link rel="stylesheet" href="./css/thankYou.css" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="./css/thankYou.css"></noscript>

</head>
<body>
  <main class="header">
    <div class="header-container">
      <section class="hero-left" aria-labelledby="thanks-title">
        <h1 class="hero-title" id="thanks-title">Oxirgi qadam qoldi!</h1>
        <div class="hero-content" id="thanks-content">
          <p class="hero-text">Bepul darsni qo’lga kiritish uchun <br>quyidagi tugma orqali telegram kanalga <span>obuna bo'ling</span></p>
          <div class="hero-btn-box">
            <img class="hero-img" src="./assets/strelka.svg" width="16" height="119" alt="" loading="lazy" decoding="async">
            <a class="hero-btn thankYouBtn" id="telegram" target="_blank" rel="noopener" aria-disabled="true" tabindex="-1">obuna bo’lish</a>
          </div>
        </div>
        <div class="submission-feedback">
          <p id="thanks-message" role="status" hidden></p>
          <p id="status" role="alert" hidden></p>
          <p id="channel-status" role="status" hidden></p>
          <button id="retry-submit" type="button" hidden>Qayta yuborish</button>
          <a id="back-to-webinar" href="./" hidden>Asosiy sahifaga qaytish</a>
        </div>
      </section>
    </div>
  </main>
  <script src="./js/config.js" defer></script>
  <script src="./js/thanks.js" defer></script>
</body>
</html>
